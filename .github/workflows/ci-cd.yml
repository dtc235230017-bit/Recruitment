name: CI/CD Recruitment BPMN System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Run Unit Tests
        working-directory: ./backend
        run: |
          npm install
          npx prisma generate
          npm test

      - name: Build Docker Images
        run: |
          docker build -t recruitment-bpmn-api:latest ./backend
          docker build -t recruitment-bpmn-ui:latest ./frontend