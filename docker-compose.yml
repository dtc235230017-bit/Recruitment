version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: recruitment_db
    restart: always
    environment:
      POSTGRES_USER: hr_admin
      POSTGRES_PASSWORD: hr_secure_password_2026
      POSTGRES_DB: recruitment_bpmn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: recruitment_api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://hr_admin:hr_secure_password_2026@db:5432/recruitment_bpmn?schema=public
      JWT_SECRET: production_secret_key_2026
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build: ./frontend
    container_name: recruitment_ui
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: